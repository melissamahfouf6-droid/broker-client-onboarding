# Odoo 19 Community plus this addon. From this directory: docker compose up -d
# Then open http://localhost:8069, create a database with Demo data, and install
# Broker Client Onboarding from Apps.

services:
  web:
    image: odoo:19.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo
      - .:/mnt/extra-addons
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo-db:/var/lib/postgresql/data

volumes:
  odoo-data:
  odoo-db:
